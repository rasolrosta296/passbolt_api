name: Publish Keycloak SSO API release candidate

"on":
  push:
    tags:
      - "keycloak-sso-v*"

permissions: {}

jobs:
  release:
    if: github.repository == 'rasolrosta296/passbolt_api'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^keycloak-sso-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::Invalid Keycloak SSO release-candidate tag."
            exit 1
          fi
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test -z "$(git status --short)"

      - name: Create source pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --prerelease \
            --title "Keycloak SSO API ${GITHUB_REF_NAME#keycloak-sso-}" \
            --notes "Source release candidate for the Passbolt CE Keycloak cryptographic SSO plugin. OIDC and server-share release do not authenticate Passbolt; unchanged GPGAuth remains final authority."
