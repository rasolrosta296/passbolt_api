name: Publish Keycloak SSO API image

"on":
  push:
    tags:
      - "keycloak-sso-v*"

permissions: {}

jobs:
  image:
    if: github.repository == 'rasolrosta296/passbolt_api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^keycloak-sso-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::Invalid Keycloak SSO release-candidate tag."
            exit 1
          fi
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test -z "$(git status --short)"

      - name: Audit locked production Composer dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker run --rm \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/composer.json,target=/app/composer.json,readonly" \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/composer.lock,target=/app/composer.lock,readonly" \
              --workdir /app \
              composer:2.8.12@sha256:5248900ab8b5f7f880c2d62180e40960cd87f60149ec9a1abfd62ac72a02577c \
              audit --locked --no-dev; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 5
            fi
          done
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/rasolrosta296/passbolt-api-keycloak-sso
          tags: |
            type=match,pattern=keycloak-sso-v(.*),group=1
            type=sha,format=long

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/keycloak-sso/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/rasolrosta296/passbolt-api-keycloak-sso
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Report immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IMAGE_DIGEST}"
          printf 'Published image digest: %s\n' "${IMAGE_DIGEST}"
